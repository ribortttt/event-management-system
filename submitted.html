<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPro | Booking Submitted</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ems.css">
</head>
<body class="home-body">

  <header class="home-navbar">
    <a href="user-home.html" class="home-brand">
      <i class="fa-regular fa-calendar-check"></i>
      <span>EventPro</span>
    </a>

    <nav class="home-nav">
      <a href="user-home.html">Home</a>
      <a href="eventtype.html">Event Types</a>
      <a href="aboutus.html#contact">Contact</a>
    </nav>

    <a href="eventdetails.html" class="btn-primary">Book an Event</a>
  </header>

  <main class="bs-page">
    <div class="bs-check">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1>Booking Submitted!</h1>
    <p class="bs-message">Your event booking has been successfully submitted.<br>Please wait for our team to review and confirm your request.</p>

    <section class="bs-card">
      <div class="bs-item">
        <span class="bs-label">Event Type:</span>
        <span class="bs-value">Wedding</span>
      </div>

      <div class="bs-item">
        <span class="bs-label">Date:</span>
        <span class="bs-value">Oct 26, 2028</span>
      </div>

      <div class="bs-item">
        <span class="bs-label">Venue:</span>
        <span class="bs-value">Riverside Hotel</span>
      </div>

      <div class="bs-item">
        <span class="bs-label">Guests:</span>
        <span class="bs-value">100</span>
      </div>

      <div class="bs-item bs-budget">
        <span class="bs-label">Budget:</span>
        <span class="bs-value">₱ 80,000 - ₱ 120,000</span>
      </div>
    </section>

    <a href="user-home.html" class="bs-home-button">Back to Home</a>
  </main>
<script src="user.js"></script>
</body>
</html>
