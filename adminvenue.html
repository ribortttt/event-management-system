<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue Management | EventPro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body" data-page="venues">

  <aside class="sidebar"></aside>

  <main class="main">
    <div class="av-page">

      <div class="av-head">
        <div>
          <h1>Venue Management</h1>
          <p>Manage your venues, capacity and availability.</p>
        </div>
        <a href="#" class="av-add" id="addVenueBtn"><i class="fa-solid fa-plus"></i> Add Venue</a>
      </div>

      <div class="av-filters">
        <div class="av-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="venueSearch" placeholder="Search venue..." aria-label="Search venues">
        </div>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <select id="locationFilter" aria-label="Filter by location">
          <option value="">All Locations</option>
        </select>
      </div>

      <div class="av-table-wrap">
        <table class="av-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Venue Name</th>
              <th>Location</th>
              <th>Capacity</th>
              <th>Availability</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="venueRows"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="user.js"></script>
  <script src="admin.js"></script>
</body>
</html>
