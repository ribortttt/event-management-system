<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events | EventPro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body" data-page="events">

  <aside class="sidebar"></aside>

  <main class="main">
    <div class="ae-page">

      <div class="ae-head">
        <div>
          <h1>Events</h1>
          <p>View and manage your event listings.</p>
        </div>
        <a href="#" class="ae-add" id="addEventBtn"><i class="fa-solid fa-plus"></i> Add Event</a>
      </div>

      <div class="ae-filters">
        <div class="ae-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="eventSearch" placeholder="Search events..." aria-label="Search events">
        </div>
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="">All Categories</option>
        </select>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All Status</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending">Pending</option>
        </select>
      </div>

      <div class="ae-table-wrap">
        <table class="ae-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Event Name</th>
              <th>Category</th>
              <th>Date</th>
              <th>Venue</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="eventRows"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="user.js"></script>
  <script src="admin.js"></script>
</body>
</html>
