<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPro | Bookings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside class="sidebar">
    <div class="sb-brand">
      <i class="fa-regular fa-calendar-check"></i>
      <div><strong>EventPro</strong><small>Admin Panel</small></div>
    </div>

    <nav class="sb-nav">
      <a href="admindash.html" ><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="adminbookings.html" class="is-active"><i class="fa-regular fa-calendar-check"></i> Bookings</a>
      <a href="adminevent.html"><i class="fa-regular fa-calendar-days"></i> Events</a>
      <a href="adminsched.html"><i class="fa-regular fa-calendar"></i> Calendar & Scheduling</a>
      <a href="adminvenue.html"><i class="fa-solid fa-building"></i> Venue Management</a>
      <a href="adminguest.html"><i class="fa-solid fa-users"></i> Participants / Guests</a>
      <a href="adminreport.html"><i class="fa-solid fa-chart-pie"></i> Reports & Reminders</a>
      <a href="adminsettings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>

    <div class="sb-user">
      <span class="sb-avatar"><i class="fa-regular fa-user"></i></span>
      <div><strong>Ms. Mai</strong><small>Admin</small></div>
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </aside>

  <main class="main">
    <div class="ab-page">

      <header class="ab-head">
        <div>
          <h1>Bookings</h1>
          <p>Manage and track all event bookings.</p>
        </div>
        <a href="eventdetails.html" class="ab-add"><i class="fa-solid fa-plus"></i> Add Booking</a>
      </header>

      <div class="ab-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="abSearch" placeholder="Search by name, event, or booking ID...">
      </div>

      <div class="ab-filters">
        <select id="abStatus" aria-label="Filter by status">
          <option value="">All Status</option>
          <option value="confirmed">Confirmed</option>
          <option value="pending">Pending</option>
          <option value="declined">Declined</option>
        </select>
        <select id="abType" aria-label="Filter by event type">
          <option value="">All Events</option>
        </select>
        <input type="date" id="abStart" aria-label="Start date" title="Start date">
        <input type="date" id="abEnd" aria-label="End date" title="End date">
      </div>

      <div class="ab-table-wrap">
        <table class="ab-table">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Customer Name</th>
              <th>Event Type</th>
              <th>Date</th>
              <th>Guests</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="abRows"></tbody>
        </table>
      </div>

      <nav class="ab-pager" id="abPager" aria-label="Pagination"></nav>

    </div>
</main>
<script src="admin-shared.js"></script>
</body>
</html>
