<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Reminders | EventPro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body" data-page="reports">

  <aside class="sidebar"></aside>

  <main class="main ar-page">
    <header class="ar-head">
      <div>
        <h1>Reports &amp; Reminders</h1>
        <p>View event reports and upcoming reminders.</p>
      </div>
    </header>

    <section class="stats ar-stats">
      <div class="stat stat-blue">
        <i class="fa-regular fa-calendar-days"></i>
        <h3>Total Events</h3>
        <div class="num" id="rEvents">0</div>
        <span class="note" id="rEventsNote"></span>
      </div>

      <div class="stat stat-green">
        <i class="fa-solid fa-user-group"></i>
        <h3>Total Guests</h3>
        <div class="num" id="rGuests">0</div>
        <span class="note" id="rGuestsNote"></span>
      </div>

      <div class="stat stat-lav">
        <i class="fa-solid fa-wallet"></i>
        <h3>Est. Revenue</h3>
        <div class="num" id="rRevenue">&#8369; 0</div>
        <span class="note">Based on confirmed bookings</span>
      </div>

      <div class="stat stat-yellow">
        <i class="fa-regular fa-bell"></i>
        <h3>Pending Actions</h3>
        <div class="num" id="rPending">0</div>
        <a href="adminbookings.html?status=pending" class="note ar-link-note">View details &rarr;</a>
      </div>
    </section>

    <section class="ar-grid">
      <div class="panel ar-panel">
        <h2>Event Summary by Category</h2>
        <div class="ar-chart-container">
          <div class="ar-donut-wrapper">
            <canvas id="categoryChart"></canvas>
          </div>
          <ul class="ar-legend-list" id="rLegend"></ul>
        </div>
      </div>

      <div class="panel ar-panel">
        <h2>Upcoming Reminders</h2>
        <ul class="ar-reminders-list" id="rReminders"></ul>
      </div>
    </section>
  </main>

  <script src="user.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
