<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar & Scheduling | EventPro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body" data-page="schedule">

  <aside class="sidebar"></aside>

  <main class="main">
    <div class="as-page">

      <div class="as-head">
        <h1>Calendar &amp; Scheduling</h1>
        <p>View your event schedule and manage availability.</p>
        <div class="as-venue">
          <label for="schedVenue">Venue</label>
          <select id="schedVenue"></select>
          <span id="schedHint" aria-live="polite"></span>
        </div>
      </div>

      <div class="as-grid">
        <section class="as-card as-cal" aria-label="Calendar">
          <div class="as-cal-nav">
            <button type="button" id="prevMonth" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="calTitle"></h2>
            <button type="button" id="nextMonth" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="as-cal-grid" id="calGrid"></div>
          <div class="as-legend">
            <span><i style="background:#ef4a5a"></i>Booked</span>
            <span><i style="background:#2fb68b"></i>Available</span>
            <span><i style="background:#3b6cf6"></i>Today</span>
          </div>
        </section>

        <section class="as-card as-up" aria-label="Upcoming events">
          <h2>Upcoming Events</h2>
          <div id="upcomingList"></div>
        </section>
      </div>

    </div>
  </main>

  <script src="user.js"></script>
  <script src="admin.js"></script>
</body>
</html>
