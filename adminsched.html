<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar &amp; Scheduling | EventPro Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <aside class="sidebar">
    <div class="sb-brand">
      <i class="fa-regular fa-calendar"></i>
      <div><strong>EventPro</strong><small>Admin Panel</small></div>
    </div>

    <nav class="sb-nav">
      <a href="admindash.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="adminbookings.html"><i class="fa-regular fa-calendar-check"></i> Bookings</a>
      <a href="adminevent.html"><i class="fa-regular fa-calendar-days"></i> Events</a>
      <a href="adminsched.html" class="is-active"><i class="fa-regular fa-calendar"></i> Calendar & Scheduling</a>
      <a href="adminvenue.html"><i class="fa-solid fa-building"></i> Venue Management</a>
      <a href="adminguest.html"><i class="fa-solid fa-users"></i> Participants / Guests</a>
      <a href="adminreport.html"><i class="fa-solid fa-chart-pie"></i> Reports & Reminders</a>
      <a href="adminsettings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>

    <div class="sb-user">
      <div class="sb-avatar"><i class="fa-regular fa-user"></i></div>
      <div><strong>Ms. Mai</strong><small>Admin</small></div>
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </aside>

  <main class="main">
    <div class="as-page">

      <div class="as-head">
        <h1>Calendar &amp; Scheduling</h1>
        <p>View your event schedule and manage availability.</p>
      </div>

      <div class="as-grid">
        <section class="as-card as-cal" aria-label="Calendar">
          <div class="as-cal-nav">
            <button id="prevMonth" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="calTitle">October 2026</h2>
            <button id="nextMonth" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="as-cal-grid" id="calGrid"></div>
          <div class="as-legend">
            <span><i style="background:#ef4a5a"></i>Booked</span>
            <span><i style="background:#2fb68b"></i>Available</span>
            <span><i style="background:#3b6cf6"></i>Today</span>
          </div>
        </section>

        <section class="as-card as-up" aria-label="Upcoming events">
          <h2>Upcoming Events</h2>
          <div id="upcomingList"></div>
        </section>
      </div>

    </div>
  </main>

  <script src="adminsched.js"></script>
  <script src="admin-shared.js"></script>
</body>
</html>
