<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPro | Event Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ems.css">
</head>
<body class="home-body">

  <header class="home-navbar">
    <a href="user-home.html" class="home-brand">
      <i class="fa-regular fa-calendar-check"></i>
      <span>EventPro</span>
    </a>

    <nav class="home-nav" aria-label="Main">
      <a href="user-home.html">Home</a>
      <a href="eventtype.html">Event Types</a>
      <a href="aboutus.html#contact">Contact</a>
    </nav>

    <a href="eventtype.html" class="btn-primary">Book an Event</a>
  </header>

  <ol class="ed-steps" aria-label="Booking steps">
    <li class="ed-step is-active"><span class="ed-step-number">1</span><span>Event Details</span></li>
    <li class="ed-step"><span class="ed-step-number">2</span><span>Your Information</span></li>
    <li class="ed-step"><span class="ed-step-number">3</span><span>Review &amp; Submit</span></li>
  </ol>

  <main class="ed-page">
    <form class="ed-form">

      <div class="ed-heading">
        <h1>Event Details</h1>
        <p>Please fill in the details below for your event booking.</p>
      </div>

      <div class="ed-field ed-event-type">
        <label for="event-type">Event type</label>
        <select id="event-type" required>
          <option value="" disabled selected>Select event type</option>
        </select>
      </div>

      <div class="ed-field ed-date">
        <label for="event-date">Event Date</label>
        <div class="ed-date-wrap">
          <i class="fa-regular fa-calendar ed-date-icon"></i>
          <input type="date" id="event-date" required>
          <i class="fa-solid fa-chevron-down ed-date-chevron"></i>
        </div>
      </div>

      <div class="ed-field ed-venue">
        <label for="venue">Venue</label>
        <select id="venue" required>
          <option value="" disabled selected>Select venue</option>
        </select>
      </div>

      <div class="ed-field ed-guests">
        <label for="guests">Number of Guests / Pax</label>
        <input type="number" id="guests" min="1" placeholder="Enter the number of guests" required>
      </div>

      <div class="ed-field ed-budget">
        <label for="budget">Budget(PHP)</label>
        <select id="budget" required>
          <option value="" disabled selected>Select budget range</option>
          <option value="Below 30,000">Below 30,000</option>
          <option value="30,000-50,000">30,000-50,000</option>
          <option value="50,000-100,000">50,000-100,000</option>
          <option value="100,000-150,000">100,000-150,000</option>
          <option value="150,000-200,000">150,000-200,000</option>
          <option value="Above 200,000">Above 200,000</option>
        </select>
      </div>

      <div class="ed-field ed-details">
        <label for="details">Other Event Details</label>
        <textarea id="details" placeholder="Tell us more about your event (theme,special requests,etc.)"></textarea>
      </div>

      <div class="ed-actions">
        <button type="submit" class="ed-submit">Submit <i class="fa-solid fa-arrow-right"></i></button>
      </div>

      <aside class="ed-help">
        <div class="ed-help-icon"><i class="fa-regular fa-calendar"></i></div>
        <h2>Need help?</h2>
        <p>You can always contact us<br>for any inquiries</p>
        <a href="aboutus.html#contact" class="ed-help-button">Contact Us</a>
      </aside>

    </form>
  </main>

  <script src="user.js"></script>
</body>
</html>
